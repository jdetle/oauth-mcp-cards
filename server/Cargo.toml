[package]
name = "oauth-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
flate2 = "1"
base64 = "0.22"
hmac = "0.13.0"
rand = "0.8"
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "set-header"] }
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "oauth-mcp-server"
path = "src/main.rs"

[profile.release]
codegen-units = 4
lto = "thin"

# scrypt and ed25519 are slow unoptimised; keep tests fast
[profile.dev.package."*"]
opt-level = 2
