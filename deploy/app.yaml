AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OAuth for MCP card game on ECS Fargate. CloudFront (HTTPS) -> ALB (only reachable from CloudFront)
  -> one Fargate task. Rooms are played in that task's memory and saved to DynamoDB on every
  change, so a deploy (or a crash) hands live games to the next task.

Parameters:
  ImageUri:
    Type: String
  CloudFrontPrefixList:
    Type: String
    Description: Managed prefix list id for com.amazonaws.global.cloudfront.origin-facing in this region
  AdminHashParam:
    Type: String
    Default: ""
    Description: SSM SecureString parameter name holding the admin password hash (empty = admin disabled)
  TurnstileSiteKey:
    Type: String
    Default: ""
    Description: Cloudflare Turnstile site key (public). Empty = bot check off
  BasePath:
    Type: String
    Default: ""
    Description: Serve the app under this prefix (e.g. /games). Must match the image's BASE_PATH build arg
  LegacyBasePath:
    Type: String
    Default: ""
    Description: A prefix the site used to live under (e.g. /mcp-oauth); links there are redirected to BasePath
  EdgePublicKey:
    Type: String
    Default: ""
    Description: Ed25519 public key (hex) of the Cloudflare Worker that signs visitor addresses
  TurnstileSecretParam:
    Type: String
    Default: ""
    Description: SSM SecureString parameter name holding the Turnstile secret key
  IdleSleepMinutes:
    Type: String
    Default: "20"
    Description: Scale to zero after this many minutes with nobody creating, joining, connecting or moving ("0" = never sleep)
  SessionSecretParam:
    Type: String
    Default: /oauth-mcp-cards/session-secret
    Description: SSM SecureString (64 hex chars) that signs session cookies; the same for every task so deploys keep people signed in

Conditions:
  HasAdmin: !Not [!Equals [!Ref AdminHashParam, ""]]
  HasTurnstile: !And [!Not [!Equals [!Ref TurnstileSiteKey, ""]], !Not [!Equals [!Ref TurnstileSecretParam, ""]]]
  HasEdgeKey: !Not [!Equals [!Ref EdgePublicKey, ""]]

Resources:
  # ---- network: small VPC, two public subnets, no NAT (task gets a public IP for ECR pulls) ----
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  RtA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable }
  RtB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable }

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - only CloudFront may connect
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: !Ref CloudFrontPrefixList }
  TaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Task - only the ALB may connect
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSg }

  # ---- load balancer ----
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSg]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "120" } # websockets ping every 25s
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /api/health
      # quick to notice a task that just started: waking from zero is health-check bound
      HealthCheckIntervalSeconds: 5
      HealthCheckTimeoutSeconds: 3
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "10" }
        - { Key: stickiness.enabled, Value: "true" }
        - { Key: stickiness.type, Value: lb_cookie }
        - { Key: stickiness.lb_cookie.duration_seconds, Value: "86400" }
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  # ---- ECS ----
  Cluster:
    Type: AWS::ECS::Cluster
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 14 }
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-app-secrets
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionSecretParam}"
                  - !If [HasAdmin, !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdminHashParam}", !Ref "AWS::NoValue"]
                  - !If [HasTurnstile, !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TurnstileSecretParam}", !Ref "AWS::NoValue"]

  # ---- games outlive any one task: every change is saved here ----
  RoomsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: room, AttributeType: S }]
      KeySchema: [{ AttributeName: room, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: expires, Enabled: true }
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: rooms
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Scan]
                Resource: !GetAtt RoomsTable.Arn
        # when nobody has done anything for IdleSleepMinutes, the task scales its own service to zero
        - PolicyName: sleep
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ecs:UpdateService
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Cluster}/*"
  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 8080 }]
          Environment:
            - { Name: SECURE_COOKIES, Value: "1" }
            - { Name: TRUST_CLOUDFRONT, Value: "1" }
            - !If [HasTurnstile, { Name: TURNSTILE_SITE_KEY, Value: !Ref TurnstileSiteKey }, !Ref "AWS::NoValue"]
            - { Name: BASE_PATH, Value: !Ref BasePath }
            - { Name: LEGACY_BASE_PATH, Value: !Ref LegacyBasePath }
            - { Name: ROOMS_TABLE, Value: !Ref RoomsTable }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: IDLE_SLEEP_MIN, Value: !Ref IdleSleepMinutes }
            - { Name: ECS_CLUSTER, Value: !Ref Cluster }
            - !If [HasEdgeKey, { Name: EDGE_PUBLIC_KEY, Value: !Ref EdgePublicKey }, !Ref "AWS::NoValue"]
          Secrets:
            - { Name: SESSION_SECRET, ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionSecretParam}" }
            - !If
              - HasAdmin
              - { Name: ADMIN_PASSWORD_HASH, ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdminHashParam}" }
              - !Ref "AWS::NoValue"
            - !If
              - HasTurnstile
              - { Name: TURNSTILE_SECRET, ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TurnstileSecretParam}" }
              - !Ref "AWS::NoValue"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDef
      # Start the new task before stopping the old one, so a deploy never leaves the load balancer
      # with nothing to send traffic to (that was a 2-minute window of 503s per deploy).
      # On SIGTERM the old task saves every room and asks each browser to reconnect (close code
      # 1012); the reconnect lands on the new task, which loads the game from DynamoDB.
      DeploymentConfiguration: { MaximumPercent: 200, MinimumHealthyPercent: 100 }
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSg]
      LoadBalancers: [{ ContainerName: app, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup }]

  # ---- wake: the edge Worker calls this when someone turns up and the service is at zero ----
  # It can only ever set the count to 1, so it is safe to expose; concurrency is capped.
  WakeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: wake
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [ecs:DescribeServices, ecs:UpdateService]
                Resource: !Ref Service
  WakeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt WakeRole.Arn
      Environment:
        Variables: { CLUSTER: !Ref Cluster, SERVICE: !GetAtt Service.Name }
      Code:
        ZipFile: |
          import json, os, boto3
          ecs = boto3.client("ecs")
          def handler(event, context):
              c, s = os.environ["CLUSTER"], os.environ["SERVICE"]
              svc = ecs.describe_services(cluster=c, services=[s])["services"][0]
              if svc["desiredCount"] == 0:
                  ecs.update_service(cluster=c, service=s, desiredCount=1)
                  state = "waking"
              else:
                  state = "awake" if svc["runningCount"] > 0 else "starting"
              return {"statusCode": 200, "headers": {"content-type": "application/json", "cache-control": "no-store"}, "body": json.dumps({"state": state})}
  WakeLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${WakeFunction}", RetentionInDays: 7 }
  WakeUrl:
    Type: AWS::Lambda::Url
    Properties: { TargetFunctionArn: !GetAtt WakeFunction.Arn, AuthType: NONE }
  WakeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref WakeFunction, Action: lambda:InvokeFunctionUrl, Principal: "*", FunctionUrlAuthType: NONE }
  WakeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref WakeFunction, Action: lambda:InvokeFunction, Principal: "*", InvokedViaFunctionUrl: true }

  # ---- CloudFront: HTTPS + websockets in front of the ALB ----
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: OAuth for MCP card game
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: alb
            DomainName: !GetAtt Alb.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc # Managed-AllViewerAndCloudFrontHeaders-2022-06
          Compress: true
        CacheBehaviors:
          - PathPattern: /games/_next/static/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            Compress: true
          - PathPattern: /mcp-oauth/_next/static/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            Compress: true
          - PathPattern: /_next/static/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            Compress: true

Outputs:
  Url: { Value: !Sub "https://${Distribution.DomainName}" }
  AlbDns: { Value: !GetAtt Alb.DNSName }
  Cluster: { Value: !Ref Cluster }
  Service: { Value: !GetAtt Service.Name }
  LogGroup: { Value: !Ref LogGroup }
  RoomsTable: { Value: !Ref RoomsTable }
  WakeUrl: { Value: !GetAtt WakeUrl.FunctionUrl }
